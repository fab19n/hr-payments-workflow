<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Payments</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
</head>
<body>
<aside class="side">
  <div class="brand">
    <svg class="mark" viewBox="0 0 36 36" role="img" aria-label="HR Payments"><rect width="36" height="36" rx="10" fill="#2450B8"/><rect x="9" y="9" width="18" height="18" rx="4" fill="#5C83E0"/><path d="M13 15h10M13 19h6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="24" cy="23" r="3" fill="#FFFFFF"/></svg>
    <div class="words">
      <div class="name">HR Payments</div>
      <div class="eyebrow" id="orgName" hidden></div>
    </div>
  </div>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div class="side-foot"><div class="foot-card"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons.svg#i-verified"/></svg><b>Records stay on this PC</b></div></div>
</aside>
<div class="content">
  <header class="top" id="topbar">
    <nav class="crumbs" aria-label="Breadcrumb"><div id="pageTitle" class="crumb"></div></nav>
    <div class="tb-slot tb-company" id="tbCompany"></div>
    <div class="month-pick" role="group" aria-label="Month">
      <button type="button" id="prevMonth" aria-label="Previous month"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons.svg#i-chevronLeft"/></svg></button>
      <div class="month-now"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons.svg#i-calendar"/></svg><span id="monthLabel" class="label" aria-live="polite"></span></div>
      <button type="button" id="nextMonth" aria-label="Next month"><svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="/static/icons.svg#i-chevronRight"/></svg></button>
      <button type="button" id="thisMonth" class="ghost small" hidden>Current</button>
    </div>
    <div class="tb-slot tb-user" id="tbUser"></div>
  </header>
  <main id="main"></main>
</div>
<aside id="drawer" class="drawer" hidden></aside>
<div id="toast" class="toast-stack" aria-live="polite"></div>
<input type="file" id="filePick" hidden multiple>
<!-- The page script, in the order it runs (plain scripts, no build step; they share one scope). -->
<script src="/static/js/core/base.js"></script>
<script src="/static/js/core/dialog.js"></script>
<script src="/static/js/core/states.js"></script>
<script src="/static/js/core/router.js"></script>
<script src="/static/js/core/menu.js"></script>
<script src="/static/js/core/topbar.js"></script>
<script src="/static/js/core/shell.js"></script>
<script src="/static/js/core/next.js"></script>
<script src="/static/js/pages/overview.js"></script>
<script src="/static/js/pages/company.js"></script>
<script src="/static/js/pages/checklist.js"></script>
<script src="/static/js/pages/budget.js"></script>
<script src="/static/js/pages/bank.js"></script>
<script src="/static/js/pages/sql.js"></script>
<script src="/static/js/pages/books.js"></script>
<script src="/static/js/pages/recurring.js"></script>
<script src="/static/js/pages/audit.js"></script>
<script src="/static/js/pages/payroll.js"></script>
<script src="/static/js/pages/packcheck.js"></script>
<script src="/static/js/pages/backup.js"></script>
<script src="/static/js/pages/placeholders.js"></script>
<script src="/static/js/pages/setup.js"></script>
<script src="/static/js/pages/setup-paste.js"></script>
<script src="/static/js/pages/setup-checklist.js"></script>
<script src="/static/js/pages/setup-reminders.js"></script>
<script src="/static/js/pages/trail.js"></script>
<script src="/static/js/core/events.js"></script>
<script src="/static/js/core/listeners.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
