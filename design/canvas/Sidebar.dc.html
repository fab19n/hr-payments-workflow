<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nv:hover{background:#16263F !important;color:#FFFFFF !important}
.nb:hover{background:#1A2C49 !important}
.nl:hover{color:#FFFFFF !important}
.sbh:hover{background:#16263F !important;color:#D6E2FB !important}
:where(a,button,[tabindex]):focus-visible{outline:2px solid #8DB0FA;outline-offset:2px}
.fr:focus-visible{outline-offset:-2px}
.sbh:focus-visible{outline-color:#8DB0FA}
@keyframes sbUnfold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sb-ex{animation:sbUnfold .18s cubic-bezier(.22,1,.36,1) both}
.sb-chev{display:inline-flex;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.sb-chev.on{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition-duration:1ms !important;scroll-behavior:auto !important}}
</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 1020px; height: 100%; box-sizing: border-box; background: {{bg}}; border-right: 1px solid {{edge}}; color: #B8C4D6; font-family: Inter, system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; transition: background-color .2s ease-out, border-color .2s ease-out">
  <div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 8px">
    <svg viewBox="0 0 36 36" width="36" height="36" role="img" aria-label="HR Payments">
      <rect x="0" y="0" width="36" height="36" rx="10" fill="#2450B8"></rect>
      <rect x="9" y="9" width="18" height="18" rx="4" fill="#5C83E0"></rect>
      <path d="M13 15h10M13 19h6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="24" cy="23" r="3" fill="#FFFFFF"></circle>
    </svg>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-size: 16px; line-height: 20px; color: #FFFFFF">HR Payments</span>
      <span style="font-size: 12px; line-height: 16px; color: #93A4BF">Agrinexus · HR &amp; Finance</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <div role="group" aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.hasHead}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="sbh fr" aria-expanded="{{g.exp}}" onClick="{{g.toggle}}" style="transition: background-color .12s ease-out, color .12s ease-out; width: 100%; height: 32px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #8C9DB8; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; text-align: left">
            <span style="flex: 1; min-width: 0">{{g.label}}</span>
            <sc-if value="{{g.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{g.badge}}"><sc-if value="{{g.over}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" glyph="alert" tone="white" size="12" hint-size="12px,12px"></dc-import></sc-if><span aria-hidden="true">{{g.n}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{g.sr}}</span></span></sc-if>
            <span class="{{g.chev}}" aria-hidden="true"><dc-import name="Icon" glyph="chevronRight" tone="nav" size="16" hint-size="16px,16px"></dc-import></span>
          </button>
        </sc-if>
        <sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
          <div class="{{g.listCls}}" style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
              <a href="{{it.href}}" class="nv" aria-current="{{it.cur}}" title="{{it.title}}" style="{{it.st}}"><dc-import name="Icon" glyph="{{it.glyph}}" tone="{{it.tn}}" size="20" hint-size="20px,20px"></dc-import><span style="flex: 1; min-width: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
                <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{it.badge}}"><sc-if value="{{it.over}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" glyph="alert" tone="white" size="12" hint-size="12px,12px"></dc-import></sc-if><span aria-hidden="true">{{it.n}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{it.sr}}</span></span></sc-if>
              </a>
            </sc-for>
            <sc-if value="{{g.hasSub}}" hint-placeholder-val="{{ false }}">
              <div role="group" aria-label="{{g.subLabel}}" style="display: flex; flex-direction: column; gap: 2px">
                <span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: #8C9DB8">{{g.subLabel}}<span aria-hidden="true" style="flex: 1; height: 1px; background: #22375A"></span></span>
                <sc-for list="{{g.subItems}}" as="su" hint-placeholder-count="4">
                  <a href="{{su.href}}" class="nv" aria-current="{{su.cur}}" title="{{su.title}}" style="{{su.st}}"><dc-import name="Icon" glyph="{{su.glyph}}" tone="{{su.tn}}" size="20" hint-size="20px,20px"></dc-import><span style="flex: 1; min-width: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{su.label}}</span>
                    <sc-if value="{{su.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{su.badge}}"><sc-if value="{{su.over}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" glyph="alert" tone="white" size="12" hint-size="12px,12px"></dc-import></sc-if><span aria-hidden="true">{{su.n}}</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{su.sr}}</span></span></sc-if>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; border-radius: 12px; background: #132541; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px"><dc-import name="Icon" glyph="{{status.glyph}}" tone="{{status.tone}}" size="20" hint-size="20px,20px"></dc-import><b style="color: #FFFFFF; font-size: 13px; line-height: 18px">{{status.head}}</b></div>
    <span style="font-size: 12px; line-height: 16px; color: #A7B6CD">{{status.line}}</span>
    <sc-if value="{{status.attention}}" hint-placeholder-val="{{ false }}">
      <a href="AuditTrail.dc.html" class="nl" style="color: #FFB4AB; font-size: 12px; font-weight: 600; min-height: 24px; display: inline-flex; align-items: center; text-decoration: underline">Open the audit trail</a>
    </sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"overview","options":["overview","staff","calendar","leave","claims","advances","payroll","approvals","topay","register","checklist","budget","recurring","bank","sql","einvoices","books","parties","statutory","sales","purchases","journals","close","setup","pack","trail","backup","users","aisb","ai","ail","aip"]},"kind":{"editor":"enum","default":"sqlPayroll","options":["sqlPayroll","sql","here"]},"access":{"editor":"enum","default":"full","options":["full","noHr","noAdmin","noHrNoAdmin","hrOnly","approver"]},"company":{"editor":"enum","default":"aisb","options":["aisb","ai","ail","aip","all"]},"merged":{"editor":"enum","default":"yes","options":["yes","no"]},"fold":{"editor":"enum","default":"auto","options":["auto","open"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"companies":{"editor":"enum","default":"two","options":["two","one","four","none"]},"trail":{"editor":"enum","default":"ok","options":["ok","attention"]},"todo":{"editor":"enum","default":"list","options":["list","none"]},"hosting":{"editor":"enum","default":"pc","options":["pc","hosted"]},"$preview":{"width":264,"height":1460}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    // Old keys from the boards drawn before the new menu keep working: each company's month page is now the
    // Payments register of the company chosen in the top-bar switcher.
    const OLD = { aisb: 'register', ai: 'register', ail: 'register', aip: 'register' };
    // An old key also names the company the page shows, so the menu and badges follow that company's settings
    // (samples section 2) unless the board passes company and kind itself.
    const OLD_CO = { aisb: ['aisb', 'sqlPayroll'], ai: ['ai', 'here'], ail: ['ail', 'sql'], aip: ['aip', 'here'] };
    const merged = (P.merged ?? 'yes') !== 'no';
    let active = P.active ?? 'overview';
    const oldCo = OLD_CO[active] || null;
    active = OLD[active] || active;
    // Folded menu: Calendar and reminders is a tab of Staff, Salary advances a tab of Claims and advances.
    const FOLD = { calendar: 'staff', advances: 'claims' };
    if (merged && FOLD[active]) active = FOLD[active];
    const dark = (P.theme ?? 'light') === 'dark';
    const mode = P.companies ?? 'two';
    const attention = (P.trail ?? 'ok') === 'attention';
    const hosted = (P.hosting ?? 'pc') === 'hosted';
    // Every difference between companies is a setting: Kept in SQL Account or Kept here, and Runs payroll in this
    // app. HR › Payroll shows for every company (its Workbook check tab); the run tabs live inside the page.
    const kind = P.kind ?? (oldCo ? oldCo[1] : 'sqlPayroll');
    const keptHere = kind === 'here';
    const access = P.access ?? 'full';
    // No company given: the Overview opens on All companies, as the top bar's switcher does (samples sections 3, 14).
    const company = P.company ?? (oldCo ? oldCo[0] : active === 'overview' ? 'all' : 'aisb');
    const RIGHTS = {
      full: ['overview', 'hr', 'payments', 'accounting', 'admin'],        // Aisha Rahman
      noHr: ['overview', 'payments', 'accounting', 'admin'],
      noAdmin: ['overview', 'hr', 'payments', 'accounting'],
      noHrNoAdmin: ['overview', 'payments', 'accounting'],               // Marcus Teoh, outside accountant
      hrOnly: ['overview', 'hr'],                                         // Nurul Aina
      approver: ['approvals']                                             // Hassan Ismail, later with logins
    };
    const sees = RIGHTS[access] || RIGHTS.full;

    // ONE BADGE RULE. A menu number is how many Next up rows belong to that item: the rows the Overview's Next up
    // card shows for the company chosen. Neutral blue; red, with an alert glyph, only when at least one of those
    // rows is overdue. Approvals and To pay are the only COUNT badges (requests waiting for approval; items in To
    // pay), blue, To pay red when an item in it is overdue. A Next up row whose place is To pay is counted inside
    // the To pay count, never added to it. Every badge carries a text label for screen readers.
    // Rows as samples.md section 14 (ids are its row numbers); rows 8 and 15 are all-companies rows. Row 2 (rule 14,
    // Statutory payables) is gone: October's KWSP is entered and unpaid, so its one row is "Pay KWSP for October" (row 3).
    const ROWS = {
      aisb: [
        { id: 1, area: 'register', over: true },     // Consultant fee not on the October statement
        { id: 3, area: 'topay', over: true },        // Pay KWSP for October (AISB)
        { id: 5, area: 'checklist', over: true },    // Sep AISB: SQL books agree with SQL Account
        { id: 6, area: 'payroll', over: false },     // Nov AISB: the payroll check found 3 things to fix before paying
        { id: 7, area: 'bank', over: false },        // Explain 5 bank lines on Maybank current
        { id: 8, area: 'budget', over: false },      // Enter the bank balance for the November budget
        { id: 9, area: 'sql', over: false },         // Fetch SQL's Oct and Nov Payment Voucher listings
        { id: 11, area: 'calendar', over: false },   // A probation ends on 30 Nov: confirm or extend it
        { id: 12, area: 'checklist', over: false },  // CP22A for Kah Seng
        { id: 13, area: 'checklist', over: false },  // e-CP22 for Daniel
        { id: 15, area: 'backup', over: false }      // Last backup: 11 Nov, 7 days ago
      ],
      ai: [
        { id: 4, area: 'topay', over: true },        // Pay KWSP for October (AI)
        { id: 8, area: 'budget', over: false },
        { id: 10, area: 'pack', over: false },       // Build and file the October audit pack
        { id: 14, area: 'calendar', over: false },   // A work permit expires on 10 Jan 2027
        { id: 15, area: 'backup', over: false }
      ],
      ail: [{ id: 8, area: 'budget', over: false }, { id: 15, area: 'backup', over: false }],
      aip: [{ id: 8, area: 'budget', over: false }, { id: 15, area: 'backup', over: false }]
    };
    const COUNTS = {
      aisb: { approvals: [3, 0], topay: [6, 2] },
      ai: { approvals: [0, 0], topay: [2, 1] },
      ail: { approvals: [1, 0], topay: [2, 0] },
      aip: { approvals: [0, 0], topay: [2, 0] }
    };
    const IN_USE = { two: ['aisb', 'ai'], one: ['aisb'], four: ['aisb', 'ai', 'ail', 'aip'], none: [] }[mode] || ['aisb', 'ai'];
    const cos = mode === 'none' ? [] : (company === 'all' ? IN_USE : [company]);
    const noTodo = (P.todo ?? 'list') === 'none';
    let todo = [];
    const counts = { approvals: [0, 0], topay: [0, 0] };
    if (!noTodo) {
      const seen = {};
      for (const c of cos) for (const r of (ROWS[c] || [])) if (!seen[r.id]) { seen[r.id] = 1; todo.push(r); }
      for (const c of cos) for (const k of ['approvals', 'topay']) { counts[k][0] += COUNTS[c][k][0]; counts[k][1] += COUNTS[c][k][1]; }
      if (attention && cos.length) todo = [{ id: 0, area: 'trail', over: true }].concat(todo);   // Review the changes made outside the app
    }

    // The menu. Hrefs point at today's boards; pages drawn in later packages point at their planned board names.
    const GROUP = { staff: 'hr', calendar: 'hr', leave: 'hr', claims: 'hr', advances: 'hr', payroll: 'hr',
      approvals: 'payments', topay: 'payments', register: 'payments', checklist: 'payments', budget: 'payments', recurring: 'payments',
      bank: 'accounting', sql: 'accounting', einvoices: 'accounting', books: 'accounting', parties: 'accounting', statutory: 'accounting',
      sales: 'accounting', purchases: 'accounting', journals: 'accounting', close: 'accounting',
      setup: 'admin', pack: 'admin', trail: 'admin', backup: 'admin', users: 'admin', overview: 'overview' };
    const L = { overview: 'Main.dc.html', staff: 'HrStaff.dc.html', calendar: 'HrCalendar.dc.html', leave: 'HrLeave.dc.html',
      claims: 'HrClaims.dc.html', advances: 'HrAdvances.dc.html', payroll: 'PayrollCheck.dc.html',
      approvals: 'Approvals.dc.html', topay: 'ToPay.dc.html', register: 'PaymentsRegister.dc.html', checklist: 'MonthlyChecklist.dc.html',
      budget: 'Budget.dc.html', recurring: 'Recurring.dc.html', bank: 'Bank.dc.html', sql: 'Sql.dc.html', einvoices: 'MyInvois.dc.html',
      books: 'Books.dc.html', parties: 'BooksParties.dc.html', statutory: 'BooksStatutory.dc.html',
      sales: 'AccountingKeptHere.dc.html', purchases: 'AccountingKeptHere.dc.html#purchases', journals: 'AccountingKeptHere.dc.html#journals', close: 'AccountingKeptHere.dc.html#close',
      setup: 'SetupCompanies.dc.html', pack: 'AuditPack.dc.html', trail: 'AuditTrail.dc.html', backup: 'Backup.dc.html', users: 'UsersAccess.dc.html' };
    // Dark boards exist for Overview, the Payments register (Company month) and Bank only; every other link stays light.
    const D = { overview: 'DarkOverview.dc.html', register: 'DarkCompany.dc.html', bank: 'DarkBank.dc.html' };

    const I = (k, label, glyph) => ({ k, label, glyph });
    const hrItems = [I('staff', 'Staff', 'staff'), I('leave', 'Leave', 'leave')]
      .concat(merged ? [] : [I('calendar', 'Calendar and reminders', 'reminder')])
      .concat([I('claims', merged ? 'Claims and advances' : 'Claims', 'claim')])
      .concat(merged ? [] : [I('advances', 'Salary advances', 'advance')])
      .concat([I('payroll', 'Payroll', 'payroll')]);
    const payItems = [I('approvals', 'Approvals', 'approval'), I('topay', 'To pay', 'toPay'), I('register', 'Payments register', 'payment'),
      I('checklist', 'Monthly checklist', 'checklist'), I('budget', 'Budget', 'budget'), I('recurring', 'Recurring', 'recurring')];
    const accItems = [I('bank', 'Bank and reconciliation', 'bank')]
      .concat(keptHere ? [] : [I('sql', 'SQL import', 'database')])
      .concat([I('einvoices', 'e-Invoices', 'verified'), I('books', 'Books', 'books'), I('parties', 'Customers and suppliers', 'users'), I('statutory', 'Statutory payables', 'statutory')]);
    const hereItems = keptHere ? [I('sales', 'Sales', 'receipt'), I('purchases', 'Purchases', 'inbox'), I('journals', 'Journals', 'sheet'), I('close', 'Period close', 'lock')] : [];
    const adminItems = [I('setup', 'Setup', 'sliders'), I('pack', 'Audit pack', 'pack'), I('trail', 'Audit trail', 'trail'), I('backup', 'Backup', 'vault'), I('users', 'Users and access', 'access')];

    let defs = access === 'approver'
      ? [{ key: 'payments', label: 'Payments', items: [I('approvals', 'Approvals', 'approval')], sub: [] }]
      : [
          { key: 'overview', label: 'Overview', items: [I('overview', 'Overview', 'overview')], sub: [], head: false },
          { key: 'hr', label: 'HR', items: hrItems, sub: [] },
          { key: 'payments', label: 'Payments', items: payItems, sub: [] },
          { key: 'accounting', label: 'Accounting', items: accItems, sub: hereItems },
          { key: 'admin', label: 'Admin', items: adminItems, sub: [] }
        ].filter(d => sees.includes(d.key));
    const shown = {};
    defs.forEach(d => d.items.concat(d.sub).forEach(i => { shown[i.k] = 1; }));

    // Which item a Next up row lands on: folded, the Calendar rows count on Staff.
    const place = a => (merged && FOLD[a]) ? FOLD[a] : a;
    const visRows = todo.filter(r => shown[place(r.area)]);
    const rowsOf = k => k === 'overview' ? visRows : visRows.filter(r => place(r.area) === k);
    const badgeOf = k => {
      if (k === 'approvals' || k === 'topay') {
        const [n, over] = counts[k];
        return { n, over, sr: k === 'approvals' ? n + ' waiting for approval' : n + ' to pay' + (over ? ', ' + over + ' overdue' : '') };
      }
      const rows = rowsOf(k), over = rows.filter(r => r.over).length;
      return { n: rows.length, over, sr: rows.length + ' to do' + (over ? ', ' + over + ' overdue' : '') };
    };
    const pill = over => 'position:relative;min-width:20px;height:20px;padding:0 7px;box-sizing:border-box;border-radius:99px;gap:3px;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;justify-content:center;flex:none;' + (over ? 'background:#C7372B;color:#FFFFFF' : 'background:#22375A;color:#D6E2FB');
    const base = 'transition:background-color .12s ease-out,color .12s ease-out,box-shadow .12s ease-out;position:relative;display:flex;align-items:center;gap:12px;height:36px;box-sizing:border-box;padding:0 10px;border-radius:9px;text-decoration:none;font-weight:500;';
    const item = i => {
      const on = i.k === active, b = badgeOf(i.k);
      return {
        label: i.label, glyph: i.glyph,
        href: dark && D[i.k] ? D[i.k] : L[i.k],
        title: dark && !D[i.k] ? 'Light version only in this mock' : '',
        st: base + (on ? 'background:#1E3256;color:#FFFFFF;box-shadow:inset 0 0 0 1px #2B4470' : 'color:#B8C4D6'),
        tn: on ? 'navOn' : 'nav', cur: on ? 'page' : 'false',
        hasBadge: b.n > 0, over: b.over > 0, n: String(b.n), sr: ', ' + b.sr, badge: pill(b.over > 0)
      };
    };

    // Collapsed groups. With fold "auto" the menu must fit the 1020px the boards give it: groups that don't hold
    // the page you are on fold up, from the bottom (Admin, Accounting, HR, then Payments), until it fits. A folded
    // heading keeps every badge of its items: its Next up rows, plus the Approvals and To pay counts where the group
    // holds them (a row whose place is To pay is already inside the To pay count, so it is not added again). A click
    // on a heading opens or folds it.
    const listH = n => n ? n * 36 + (n - 1) * 2 : 0;
    const openH = d => 2 + listH(d.items.length) + (d.sub.length ? 2 + 24 + 2 + listH(d.sub.length) : 0);
    // The audit trail lives in Admin: only someone with the Admin right is told it needs attention or sent to it.
    const trailAlert = attention && sees.includes('admin');
    const footer = 84 + (trailAlert ? 50 : 0) + (hosted && !trailAlert ? 18 : 0);   // a long heading wraps to two lines
    const budget = 1020 - 32 - 40 - 14 - 14 - footer - 16;
    const userOpen = (this.state && this.state.openG) || {};
    const activeGroup = GROUP[active];
    const autoShut = {};
    if ((P.fold ?? 'auto') === 'auto') {
      const isOpen = d => d.head === false || (d.key in userOpen ? userOpen[d.key] : !autoShut[d.key]);
      const height = () => defs.reduce((h, d, x) => h + (x ? 10 : 0) + (d.head === false ? 0 : 32) + (isOpen(d) ? (d.head === false ? listH(d.items.length) : openH(d)) : 0), 0);
      for (const key of ['admin', 'accounting', 'hr', 'payments']) {
        if (height() <= budget) break;
        if (key !== activeGroup && defs.some(d => d.key === key)) autoShut[key] = 1;
      }
    }

    const groups = defs.map(d => {
      const hasHead = d.head !== false;
      const open = !hasHead || (d.key in userOpen ? userOpen[d.key] : !autoShut[d.key]);
      const keys = d.items.concat(d.sub).map(i => i.k);
      const cnt = ['approvals', 'topay'].filter(k => keys.includes(k));
      // Next up rows of the group, minus those already inside a count badge.
      const rows = visRows.filter(r => keys.includes(place(r.area)) && !cnt.includes(place(r.area)));
      const rowsOver = rows.filter(r => r.over).length;
      let n = rows.length, over = rowsOver;
      const parts = [];
      for (const k of cnt) {
        const b = badgeOf(k);
        if (b.n > 0) { n += b.n; over += b.over; parts.push(b.sr); }
      }
      if (rows.length) parts.push(rows.length + ' to do' + (rowsOver ? ', ' + rowsOver + ' overdue' : ''));
      return {
        label: d.label, hasHead, open, exp: open ? 'true' : 'false',
        chev: open ? 'sb-chev on' : 'sb-chev', listCls: userOpen[d.key] ? 'sb-ex' : '',
        toggle: () => this.setState(s => ({ openG: Object.assign({}, (s && s.openG) || {}, { [d.key]: !open }) })),
        hasBadge: hasHead && !open && n > 0, over: over > 0, n: String(n),
        sr: ', ' + parts.join('; '), badge: pill(over > 0),
        items: d.items.map(item), hasSub: d.sub.length > 0, subLabel: 'Kept here', subItems: d.sub.map(item)
      };
    });

    // Where the records live is swappable copy: the hosted version says where they are kept instead.
    const head = hosted ? 'Records kept on the company server' : 'Records stay on this PC';
    // Without the Admin right the card says nothing about the audit trail, healthy or not.
    const ok = sees.includes('admin') ? 'Last encrypted backup 11 Nov, checked. Audit trail intact.' : 'Last encrypted backup 11 Nov, checked.';
    const status = trailAlert
      ? { glyph: 'alert', tone: 'dbad', head: 'The audit trail needs attention', line: '2 changes were made to the records outside this app.', attention: true }
      : { glyph: 'verified', tone: 'navOn', head, line: ok, attention: false };
    return { groups, status, bg: dark ? '#070C15' : '#0D1B2E', edge: dark ? '#1A2436' : '#0D1B2E' };
  }
}
</script>
